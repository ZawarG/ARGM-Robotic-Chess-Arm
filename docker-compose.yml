services:
  ros2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: argm-ros2:jazzy
    container_name: ros2
    volumes:
      - .:/ws
    working_dir: /ws
    environment:
      # Let the ROS nodes import the existing project code under src/
      - PYTHONPATH=/ws/core
    stdin_open: true
    tty: true
